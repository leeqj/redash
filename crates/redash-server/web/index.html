<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReDash - High-Performance Cloud Terminal & Infrastructure (GPUI Web)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      user-select: none;
      -webkit-user-select: none;
    }
    #redash-gpui-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      cursor: default;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00ffcc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(0, 255, 204, 0.2);
      border-top-color: #00ffcc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div>Loading ReDash GPUI WebAssembly Engine...</div>
  </div>

  <canvas id="redash-gpui-canvas" tabindex="0"></canvas>

  <script type="module">
    import init, { start_web_app } from '/pkg/redash_web.js';

    async function run() {
      try {
        await init();
        start_web_app('redash-gpui-canvas');
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 260);
        }
      } catch (err) {
        console.error('Failed to initialize ReDash GPUI WebAssembly:', err);
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
          overlay.innerHTML = `
            <div style="color: #f85149; text-align: center; max-width: 480px; padding: 24px; background: #161b22; border: 1px solid #30363d; border-radius: 8px;">
              <h3 style="margin-bottom: 8px; font-weight: 700;">Engine Boot Error</h3>
              <p style="font-size: 12px; color: #8b949e; word-break: break-all;">${err}</p>
            </div>`;
        }
      }
    }

    run();
  </script>
</body>
</html>
