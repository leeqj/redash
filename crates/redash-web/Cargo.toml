[package]
name = "redash-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ReDash Web Client & GPUI Web Canvas Runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redash-types = { workspace = true }
redash-ui-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
futures = { workspace = true }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
    "console",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "DomRect",
    "Performance",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "Location",
    "HtmlElement",
    "HtmlInputElement",
    "FileReader",
    "File",
    "FileList",
    "CssStyleDeclaration",
    "Notification",
    "NotificationPermission",
    "NotificationOptions",
] }

[features]
default = []
