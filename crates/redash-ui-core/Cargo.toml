[package]
name = "redash-ui-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless UI primitives, design tokens, multi-language dictionaries, and ANSI terminal grid for ReDash"

[dependencies]
redash-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }
ed25519-dalek = { version = "3.0", default-features = false, features = ["alloc", "fast"] }
curve25519-dalek = { version = "5.0", default-features = false }
sha2 = "0.10"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.12"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
