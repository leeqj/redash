[package]
name = "redash-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native host telemetry and authenticated remediation agent for ReDash"

[dependencies]
redash-types = { workspace = true }
redash-ui-core = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ed25519-dalek = "3.0"
curve25519-dalek = { version = "5.0", default-features = false }
sha2 = "0.10"
portable-pty = "0.9"
sysinfo = "0.31"
hex = "0.4"
gethostname = "1.0"
libc = "0.2"

[[bin]]
name = "redash-agent"
path = "src/main.rs"
