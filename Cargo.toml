[workspace]
resolver = "2"
members = [
    "crates/redash-types",
    "crates/redash-ui-core",
    "crates/redash-core",
    "crates/redash-app",
    "crates/redash-server",
    "crates/redash-web",
]

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
redash-types = { path = "crates/redash-types" }
redash-ui-core = { path = "crates/redash-ui-core" }
redash-core = { path = "crates/redash-core" }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
russh = "0.63"
russh-sftp = "3.0"
alacritty_terminal = "0.26"
keyring = "4.0"
smol = "2.0"
dirs = "6.0"
gpui = "0.2.2"
futures = "0.3"
unicode-width = "0.2"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
