name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Git Tag (e.g. v0.2.0-beta)'
        required: true
        default: 'v0.2.0-beta'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Desktop & Agent (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96.0
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Package macOS App Bundle
        run: ./scripts/bundle_mac.sh
      - name: Build redash-agent macOS
        run: cargo build --release -p redash-agent
      - name: Archive Desktop & Agent Artifacts
        run: |
          ditto -c -k --keepParent target/release/ReDash.app ReDash-macos-arm64.zip
          tar -czvf redash-cli-macos-arm64.tar.gz -C target/release redash
          tar -czvf redash-agent-macos-arm64.tar.gz -C target/release redash-agent
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            ReDash-macos-arm64.zip
            redash-cli-macos-arm64.tar.gz
            redash-agent-macos-arm64.tar.gz

  build-linux-server:
    name: Build Linux Server Gateway (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96.0
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Build redash-server
        run: cargo build --release --bin redash-server
      - name: Package Server Artifact
        run: |
          mkdir -p dist-server/web
          cp target/release/redash-server dist-server/
          cp -r crates/redash-server/web/* dist-server/web/
          tar -czvf redash-server-linux-x86_64.tar.gz -C dist-server .
      - name: Upload Linux Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-artifact
          path: redash-server-linux-x86_64.tar.gz

  build-linux-agent-musl:
    name: Build Static redash-agent (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: redash-agent-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-musl
            artifact: redash-agent-linux-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96.0 and Target
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Install Cross Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
      - name: Build redash-agent Musl
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release -p redash-agent --target ${{ matrix.target }}
      - name: Package Static Agent
        run: |
          tar -czvf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release redash-agent
      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  build-wasm-client:
    name: Build WebAssembly Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96.0 and WASM target
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: '0.2.128'
      - name: Build WASM client
        run: |
          cargo build --target wasm32-unknown-unknown -p redash-web --release
          wasm-bindgen target/wasm32-unknown-unknown/release/redash_web.wasm \
            --out-dir crates/redash-server/web/pkg \
            --target web \
            --no-typescript
      - name: Archive WASM Bundle
        run: |
          cd crates/redash-server/web
          zip -r ../../../redash-web-wasm.zip .
      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifact
          path: redash-web-wasm.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux-server, build-linux-agent-musl, build-wasm-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List Artifacts
        run: ls -la release-assets
      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-assets/ReDash-macos-arm64.zip
            release-assets/redash-cli-macos-arm64.tar.gz
            release-assets/redash-agent-macos-arm64.tar.gz
            release-assets/redash-agent-linux-x86_64.tar.gz
            release-assets/redash-agent-linux-aarch64.tar.gz
            release-assets/redash-server-linux-x86_64.tar.gz
            release-assets/redash-web-wasm.zip
          generate_release_notes: true
          draft: false
          prerelease: false
