name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown
      - name: Install matching wasm-bindgen
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: '0.2.128'
      - name: Build Web assets before checking the embedded Gateway
        run: bash scripts/build_web.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p redash-web --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
